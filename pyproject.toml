[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "school-palettes"
version = "0.1.0"
description = "A curated collection of natural color palettes (frogs, fish, art & history (LTC), and nature) with interactive HTML table previews."
readme = "README.md"
authors = [
    { name = "Aileen Cohen", email = "aileencohen97@gmail.com" }
]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
requires-python = ">=3.7"
dependencies = [
    "matplotlib",
    "IPython"
]

[project.urls]
Homepage = "https://github.com/AileenCohen/school-palettes"
